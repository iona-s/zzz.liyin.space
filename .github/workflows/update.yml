# Daily: merge upstream (Ticca-Liyin) into this fork, then build the arm64 image
# that Oracle A1 runs. Watchtower there pulls :latest every day at 05:00.
name: Sync upstream & publish image

on:
  schedule:
    - cron: "0 16 * * *" # 02:00 AEST / 03:00 AEDT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}

env:
  UPSTREAM: Ticca-Liyin/zzz.liyin.space

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/$UPSTREAM.git" main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with $UPSTREAM"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A conflict fails this job, so nothing is pushed or deployed.
          git merge --no-edit -m "Merge branch '${UPSTREAM%%/*}:main' into main" FETCH_HEAD
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  image:
    needs: sync
    # Scheduled runs only rebuild when upstream brought something new.
    if: github.event_name != 'schedule' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the merge pushed by the sync job
      - id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.rev.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
